name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel outdated runs on new pushes to the same ref — pull requests
# and feature branches churn, so save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # packageManager is the single source of truth for the pnpm version.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit locked dependencies
        run: pnpm audit --audit-level low

      - name: Public content boundary
        run: pnpm check:content

      - name: Check out runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omnitron-dev/omni
          ref: v0.4.6
          path: .source/omni
          persist-credentials: false

      - name: Verify documentation inventories
        run: pnpm check:source .source/omni

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Install browser for production acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production routes and interactions
        run: pnpm test:browser

      - name: Upload build artifact (on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-build-failure-node24
          path: |
            test-results/
            build/
          retention-days: 3
