name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede PR checks, but let an accepted main deployment finish atomically.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & verify (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        # packageManager is the single source of truth for the pnpm version.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit locked dependencies
        run: pnpm audit --audit-level low

      - name: Public content boundary
        run: pnpm check:content

      - name: Read the API index source revision
        id: source
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const { revision } = JSON.parse(readFileSync('src/data/api-index.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(revision)) throw Error('API index must name a full Omni commit');
          console.log('revision=' + revision);
          NODE

      - name: Check out documented platform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omnitron-dev/omni
          ref: ${{ steps.source.outputs.revision }}
          path: .source/omni
          persist-credentials: false

      - name: Verify documentation inventories
        run: pnpm check:source .source/omni

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=8192'
          SITE_URL: ${{ vars.SITE_URL || 'https://omnitron.dev' }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || '/' }}

      - name: Install browser for production acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production routes and interactions
        run: pnpm test:browser

      - name: Upload accepted Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

      - name: Upload build artifact (on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-build-failure-node24
          path: |
            test-results/
            build/
          retention-days: 3

  deploy:
    name: Deploy accepted site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
