nodeLinker: isolated
virtualStoreDir: ${LUMEN_VIRTUAL_STORE_DIR:-node_modules/.pnpm}
allowBuilds:
  "@swc/core": true
  sharp: true
  esbuild: true
  core-js: false
minimumReleaseAgeExclude:
  - "@types/node@26.6.6"
  - "@omnitron-dev/access@0.4.6"
  - "@omnitron-dev/common@0.4.6"
  - "@omnitron-dev/cuid@0.4.6"
  - "@omnitron-dev/eventemitter@0.4.6"
  - "@omnitron-dev/kb@0.4.6"
  - "@omnitron-dev/lumen-ast@0.4.6"
  - "@omnitron-dev/lumen-ui@0.4.6"
  - "@omnitron-dev/lumen@0.4.6"
  - "@omnitron-dev/msgpack@0.4.6"
  - "@omnitron-dev/netron-browser@0.4.6"
  - "@omnitron-dev/netron-http-core@0.4.6"
  - "@omnitron-dev/netron-protocol@0.4.6"
  - "@omnitron-dev/netron-react@0.4.6"
  - "@omnitron-dev/prism@0.4.6"
  - fontkit@3.0.0
verifyDepsBeforeRun: error

overrides:
  "minimatch@10": "^11.0.3"
  "joi@17": "^17.13.9"
  "katex@<0.18.2": "^0.18.2"
  "sockjs>uuid": "^11.1.1"
  "serialize-javascript@6": "^7.1.3"
